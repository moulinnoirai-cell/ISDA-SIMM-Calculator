[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isda-simm-calculator"
version = "0.1.0"
description = "ISDA SIMM initial margin calculator (methodology 2.5-2.8+2512), USD, offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
simm = "simm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
